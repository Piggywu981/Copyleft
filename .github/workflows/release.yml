name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name Copyleft
          --add-data "assets;assets"
          --add-data "fonts;fonts"
          --add-data "logos;logos"
          --add-data "config.yaml;."
          --collect-all qfluentwidgets
          main.py

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/Copyleft.exe -DestinationPath "Copyleft-${{ github.ref_name }}-windows-x64.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Copyleft-*-windows-x64.zip
          generate_release_notes: true
